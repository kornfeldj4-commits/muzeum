<title>Muzeum</title>
<script>document.documentElement.lang = "en";</script>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Which art museums are open on your day, what they cost, and what's on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<style>
/*__STYLES__*/
</style>

<div id="live" class="vh" role="status" aria-live="polite"></div>

<div id="home" class="home">
  <main class="home-main wrap">
    <h1 class="wordmark">Muzeum</h1>
    <div class="search" role="search">
      <label for="q" class="vh">Search a museum or city</label>
      <div class="search-field">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <input id="q" class="search-input" type="text" inputmode="search" enterkeyhint="search" role="combobox"
          aria-autocomplete="list" aria-expanded="false" aria-controls="sugs" autocomplete="off" autocapitalize="words"
          spellcheck="false" placeholder="Search a museum or city">
        <button type="button" class="clear-btn" aria-label="Clear search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <ul id="sugs" class="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
      <div id="search-msg" class="search-msg" hidden></div>
    </div>
  </main>
  <footer class="home-foot wrap"><span class="foot-stats"></span> <a href="about.html" class="about-link">About the data</a></footer>
</div>

<div id="results" hidden>
  <header class="rhead">
    <div class="wrap">
      <h1 class="place" id="place" tabindex="-1">&nbsp;</h1>
      <p class="listed"></p>
      <div class="strip" role="group" aria-label="Choose a day">
        <button type="button" class="strip-nav prev" aria-label="Previous 7 days">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="days"></div>
        <button type="button" class="strip-nav next" aria-label="Next 7 days">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="summary" aria-live="off"></p>
      <p class="offline-banner" hidden>You're offline. These results were loaded earlier, so every status is shown as usual hours until you reconnect.</p>
    </div>
  </header>
  <main class="results wrap" id="cards"></main>
  <p class="test-flag wrap"></p>
  <div class="pill-bar">
    <button type="button" class="pill"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Search</span></button>
  </div>
</div>
